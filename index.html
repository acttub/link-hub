<!-- 스타일은 Tailwind CLI로 src/input.css → styles.css를 구운 결과다. 손으로 고치지 않는다.

<link rel="stylesheet" href="/styles.css">

     아래 wrap의 고정 64px 계산과 어긋난다. -->
<body class="min-h-svh bg-ground text-ink font-sans text-[15px] font-medium leading-[1.6] break-keep antialiased pt-[36px] px-[20px] pb-[calc(28px+env(safe-area-inset-bottom))]">

         voice·acti는 목적지에 우리 계측이 있어 referrer로 이미 세지므로 직행 유지.
         "/go"가 아니라 "go.html"인 이유: 이 파일을 브라우저로 그냥 열어봤을 때(README가
         약속하는 방식) "/go"는 file:///go 로 잘못 풀려 메인 CTA가 죽는다. 배포본에서는
         cleanUrls가 go.html을 /go 로 한 번 넘겨주므로 양쪽 다 동작한다. -->
    <!-- 주 항목 — acttub 코어. 이 계층을 평평하게 만들지 않는다. group은 자식 .cta의 pressed 색 전환에 쓴다. -->
    <a class="item rise group block rounded-card pt-[22px] px-[22px] pb-[20px]" href="go.html?from=hub-core&utm_source=linkhub&utm_medium=bio&utm_campaign=hub&utm_content=core">

      <span class="flex h-[52px] items-center justify-center gap-[6px] rounded-control bg-primary-strong text-[16px] font-semibold text-white group-active:bg-primary-deep">지금 시작해보기<svg class="shrink-0" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
    </a>

    <!-- neutral 배경 위에서는 ink-tertiary가 4.19:1로 AA에 못 미친다 → ink-sub를 쓴다. -->
    <p class="rise mt-[26px] mb-[10px] pl-[4px] text-[12px] font-semibold text-ink-sub">가볍게 시작해보기</p>

    <a class="item rise mb-[9px] flex items-center gap-[12px] rounded-card py-[14px] px-[16px]" href="https://voice.acttub.com/?utm_source=linkhub&utm_medium=bio&utm_campaign=hub&utm_content=voice">

    <a class="item rise mb-[9px] flex items-center gap-[12px] rounded-card py-[14px] px-[16px]" href="https://acti.acttub.com/?utm_source=linkhub&utm_medium=bio&utm_campaign=hub&utm_content=acti">
      <span class="min-w-0 flex-1">
        <span class="block text-[15px] font-semibold">내 연기 캐릭터 찾기</span>
        <span class="mt-[2px] block truncate text-[13px] leading-[1.54] text-ink-tertiary">질문 14개로 찾아보는 내 연기 캐릭터</span>
      </span>
      <span class="shrink-0 rounded-full bg-primary-soft py-[4px] px-[10px] text-[12px] font-semibold tabular-nums text-primary-strong">2~3분</span>
      <svg class="shrink-0 text-ink-tertiary" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
